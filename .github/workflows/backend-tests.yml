name: Backend unit tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/platform-foundation]

jobs:
  backend-unit-tests:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: test-only-secret-key-with-at-least-32-characters
      INITIAL_ADMIN_PASSWORD: test-only-admin-password
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-test.txt
      - name: Run unit tests
        working-directory: backend
        run: python -m pytest -q
